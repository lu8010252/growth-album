<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2705f">
<title>成长册</title>
<style>
:root{--bg:#fdf6ee;--card:#fff;--ink:#3b2f2a;--muted:#8c7b72;--line:#f0e3d6;--accent:#f2705f}
@media(prefers-color-scheme:dark){:root{--bg:#1d1816;--card:#282220;--ink:#f3e9e2;--muted:#a69388;--line:#3a302c;--accent:#ff8a78}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.box{width:min(380px,90vw);text-align:center}h1{font:700 34px "Songti SC","Noto Serif SC",serif;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px}
form{background:var(--card);border-radius:20px;padding:18px;text-align:left}label span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:inherit}
button{width:100%;margin-top:14px;border:0;background:var(--accent);color:#fff;padding:12px;border-radius:999px;font:600 16px inherit;cursor:pointer}button:disabled{opacity:.5}
.err{color:#d64545;font-size:14px;margin:10px 0 0;min-height:1em}small{display:block;color:var(--muted);margin-top:10px;font-size:12px}
</style>
</head>
<body>
<div class="box"><h1>成长册</h1><p>填一次你家成长册的地址，以后打开直接进入</p>
<form id="f"><label><span>服务器地址</span><input id="u" type="text" inputmode="url" autocapitalize="none" autocorrect="off" placeholder="https://album.example.com 或 http://192.168.0.2:8010"></label>
<div class="err" id="e"></div><button id="b">连接</button>
<small>录音需要 HTTPS 地址（麦克风权限只对 HTTPS 开放）。之后想换地址：在「我的」页点「切换服务器」。</small></form></div>
<script>
const KEY = 'ga_server', $ = (s) => document.querySelector(s);
const get = () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } };
const norm = (v) => { v = v.trim().replace(/\/+$/, ''); if (!v) return ''; return /^https?:\/\//i.test(v) ? v : 'https://' + v; };
const reset = new URLSearchParams(location.search).has('reset');
if (reset) { try { localStorage.removeItem(KEY); } catch {} }
$('#u').value = get();
async function go(url, quiet) {
  $('#b').disabled = true; $('#e').textContent = quiet ? '' : '连接中…';
  try {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 8000);
    await fetch(url + '/api/init', { mode: 'no-cors', signal: c.signal, cache: 'no-store' }); clearTimeout(t);
    try { localStorage.setItem(KEY, url); } catch {}
    location.replace(url + '/');
  } catch { $('#e').textContent = '连不上这个地址，请检查地址和网络'; $('#b').disabled = false; }
}
$('#f').onsubmit = (e) => { e.preventDefault(); const u = norm($('#u').value); if (u) go(u, false); };
const saved = get(); if (saved && !reset) go(saved, true);
</script>
</body>
</html>
