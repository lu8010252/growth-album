services:
  growth-album:
    image: ghcr.io/lu8010252/growth-album:latest
    container_name: growth-album
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - MAX_UPLOAD_MB=2048
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 容器内访问宿主机上的 AI 服务时用 http://host.docker.internal:端口
    volumes:
      # 所有照片、视频、文字都在这个文件夹，备份它就等于备份全部
      - ./data:/app/data
    networks:
      - default
      - growth-net   # 与人脸识别服务同网，接口地址填 http://growth-album-face:8000/identify

networks:
  growth-net:
    external: true   # 先执行一次：docker network create growth-net
