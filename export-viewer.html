<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>成长册（离线版）</title>
<style>
:root{--bg:#fdf6ee;--card:#fff;--ink:#3b2f2a;--muted:#8c7b72;--line:#f0e3d6}
@media(prefers-color-scheme:dark){:root{--bg:#1d1816;--card:#282220;--ink:#f3e9e2;--muted:#a69388;--line:#3a302c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:28px 16px 8px;text-align:center}h1{margin:0;font:700 26px "Songti SC","Noto Serif SC",serif}
.sub{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px 16px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg)}
main{max-width:680px;margin:0 auto;padding:0 14px 60px}
h2{font-size:14px;color:var(--muted);margin:26px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{border-radius:999px;padding:1px 10px;color:#fff;font-size:12px}
.card h3{margin:8px 0 4px;font-size:18px}.body{white-space:pre-wrap;word-break:break-word}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.media img,.media video{width:100%;border-radius:12px;display:block;background:#0002;max-height:420px;object-fit:cover}
.media video{grid-column:1/-1;object-fit:contain;background:#000}
.cm{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
#lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:9}#lb img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<header><h1 id="t"></h1><div class="sub" id="s"></div></header>
<div class="chips" id="chips"></div>
<main id="list"></main>
<div id="lb" onclick="this.style.display='none'"><img></div>
<script src="data.js"></script>
<script>
const A=window.ARCHIVE,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function age(b,d){if(!b)return'';const x=new Date(b+'T00:00:00'),y=new Date(d+'T00:00:00');if(y<x)return'出生前';let Y=y.getFullYear()-x.getFullYear(),M=y.getMonth()-x.getMonth();if(y.getDate()<x.getDate())M--;if(M<0){Y--;M+=12}
if(Y<=0&&M<=0){const n=Math.round((y-x)/864e5);return n===0?'出生当天':'出生第'+n+'天'}return Y>0?(M>0?Y+'岁'+M+'个月':Y+'岁'):M+'个月'}
$('#t').textContent=A.title;$('#s').textContent='离线版 · 导出于 '+A.exportedAt+' · 共 '+A.posts.length+' 条';document.title=A.title+'（离线版）';
let f='all';
function chips(){const c=[['all','全部'],['diary','日记'],...A.kids.map(k=>[k.id,k.emoji+' '+k.name])];
$('#chips').innerHTML=c.map(([id,n])=>`<button class="${f===id?'on':''}" data-id="${id}">${esc(n)}</button>`).join('');
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{f=b.dataset.id;chips();draw()})}
function draw(){let l=A.posts.slice().reverse().filter(p=>f==='all'||(f==='diary'?p.type==='diary':p.kidIds.includes(f)));let h='',m='';
for(const p of l){const mm=p.date.slice(0,4)+'年'+(+p.date.slice(5,7))+'月';if(mm!==m){m=mm;h+=`<h2>${mm}</h2>`}
const tags=p.kidIds.map(id=>A.kids.find(k=>k.id===id)).filter(Boolean).map(k=>`<span class="tag" style="background:${k.color}">${esc(k.emoji+' '+k.name)} ${age(k.birthday,p.date)}</span>`).join('');
const med=p.media.map(x=>x.kind==='video'?`<video controls playsinline preload="metadata" ${x.poster?`poster="${x.poster}"`:''} src="${x.web||x.file}"></video>`:`<img loading="lazy" src="${x.file}" data-full="${x.file}">`).join('');
h+=`<article class="card"><div class="meta"><span>${p.date}</span>${tags}<span>${p.type==='diary'?'📖 日记':''} ${esc(p.author)}</span></div>${p.title?`<h3>${esc(p.title)}</h3>`:''}<div class="body">${esc(p.body)}</div>${med?`<div class="media">${med}</div>`:''}${p.comments.length?`<div class="cm">${p.comments.map(c=>esc(c.name)+'：'+esc(c.text)).join('<br>')}</div>`:''}</article>`}
$('#list').innerHTML=h||'<p style="text-align:center;color:var(--muted)">这里还没有内容</p>';
document.querySelectorAll('.media img').forEach(i=>i.onclick=()=>{$('#lb img').src=i.dataset.full;$('#lb').style.display='flex'})}
chips();draw();
</script>
</body>
</html>
