# 自建人脸识别服务（可选）。成长册里「我的 → AI 助手 → 设置」的「自建人脸识别接口地址」填：
#   http://growth-album-face:8000/identify
# 前提：成长册和本服务在同一个 docker 网络里（只需创建一次：docker network create growth-net）。
# 同一网络内容器直连，不经过宿主机，不受甲骨文 iptables 影响，也不用开放任何公网端口。
services:
  growth-album-face:
    image: ghcr.io/lu8010252/growth-album-face:latest
    container_name: growth-album-face
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # 仅本机可访问，方便在服务器上 curl 测试；公网和别的机器访问不到
    environment:
      - FACE_KEY=换成一串随机字符     # 成长册里「自建接口的密钥」填同一串
      - THRESHOLD=0.38                # 认不出就调低（如 0.32），认错就调高（如 0.45）
      - TZ=Asia/Shanghai
    networks:
      - growth-net

networks:
  growth-net:
    external: true
