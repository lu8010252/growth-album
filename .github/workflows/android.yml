name: Build Android APK

# 手动触发（Actions 页 → Build Android APK → Run workflow），或修改 mobile/ 目录时自动打包。
# 打好的 APK 会发布在仓库的 Releases 页（标签 apk-latest），手机直接下载安装。
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: 生成 Android 工程
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          # 允许连 http 地址（局域网 IP 部署）；录音 / 相机权限
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' $M
          # 接管下载（导出 zip / 回顾视频 MP4 / 原图），否则 WebView 里点下载没反应；Android 9 及以下需要存储权限
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          test -n "$F" && cp MainActivity.java "$F"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>#' $M
          # 换成成长册图标
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          cp -r icons/mipmap-* $R/
          npx cap sync android
      - name: 打包 APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: growth-album-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk growth-album.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest growth-album.apk --title "成长册 Android 安装包" --notes "下载 growth-album.apk 安装；首次打开填你家成长册的服务器地址。构建于 ${{ github.sha }}"
