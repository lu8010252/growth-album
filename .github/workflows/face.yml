name: Build face-service image

# face-service 有改动时构建：ghcr.io/lu8010252/growth-album-face:latest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['face-service/**', '.github/workflows/face.yml']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Diagnose (temporary)
        continue-on-error: true
        run: |
          docker build --progress=plain -t facetest face-service > build.log 2>&1 || true
          echo "::error title=build-log::$(tail -40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - uses: docker/build-push-action@v6
        with:
          context: face-service
          push: true
          platforms: linux/amd64
          tags: ghcr.io/lu8010252/growth-album-face:latest
