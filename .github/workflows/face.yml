name: Build face-service image

# face-service 有改动时构建：ghcr.io/lu8010252/growth-album-face:latest（amd64 + arm64）
# arm64 用 GitHub 原生 arm64 runner 构建（避免 QEMU 模拟编译 insightface/onnxruntime 太慢），最后合并成一个多架构 manifest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['face-service/**', '.github/workflows/face.yml']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lu8010252/growth-album-face

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: face-service
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ matrix.arch }}
          provenance: false

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge multi-arch manifest
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:amd64 ${{ env.IMAGE }}:arm64
